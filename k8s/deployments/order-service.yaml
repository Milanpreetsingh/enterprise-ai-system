apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: enterprise-ai
  labels:
    app: order-service
spec:
  ports:
    - port: 50052
      name: grpc
      targetPort: 50052
  selector:
    app: order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: enterprise-ai
  labels:
    app: order-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: enterprise-order-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
              name: grpc
          env:
            - name: PORT
              value: "50052"
            - name: DB_DSN
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: DB_DSN
            - name: USER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: USER_SERVICE_ADDR
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: KAFKA_BROKERS
            - name: KAFKA_ORDER_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: KAFKA_ORDER_TOPIC
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 15
            periodSeconds: 15

