apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: enterprise-ai
  labels:
    app: api-gateway
spec:
  ports:
    - port: 8080
      name: http
      targetPort: 8080
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: enterprise-ai
  labels:
    app: api-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: enterprise-ai-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: REDIS_ADDR
            - name: USER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: USER_SERVICE_ADDR
            - name: ORDER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: ORDER_SERVICE_ADDR
            - name: AI_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: AI_SERVICE_GRPC_ADDR
            - name: AI_HTTP_URL
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: AI_HTTP_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: enterprise-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

